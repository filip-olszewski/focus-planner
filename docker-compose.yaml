services:
  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - api

  api:
    build: ./api
    container_name: api
    environment:
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - JWT_EXPIRATION_TIME=${JWT_EXPIRATION_TIME}
      - RSA_PRIVATE_KEY=file:/app/certs/private.pem
      - RSA_PUBLIC_KEY=file:/app/certs/public.pem
    volumes:
      - ./api/certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: task_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"   # For HTTP (and SSL challenges)
      - "443:443" # For HTTPS (we will enable this in the next step)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # We will add SSL certificate volumes here in 5 minutes!
    depends_on:
      - api
      - frontend
volumes:
  pg_data: