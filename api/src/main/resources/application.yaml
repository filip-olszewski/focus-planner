spring:
  application:
    name: task-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

rsa:
  private-key: ${RSA_PRIVATE_KEY:file:certs/private.pem}
  public-key: ${RSA_PUBLIC_KEY:file:certs/public.pem}

security:
  jwt-expiration-time: ${JWT_EXPIRATION_TIME:1800}