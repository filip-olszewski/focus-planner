server {
    listen 80;
    server_name focusplanner.life www.focusplanner.life;

    location / {
        proxy_pass http://frontend:80; # or whatever port your frontend uses
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api:8080; # Your Spring Boot API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}