server {
    listen 80;
    
    # Where the static files are stored
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- NEW: Reverse Proxy for the Backend ---
    location /api/ {
        # "api" is the name of your backend service in docker-compose.yml
        proxy_pass http://api:8080/api/;
        
        # Pass necessary headers to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standard rule: if the file or directory isn't found, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}